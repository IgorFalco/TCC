name: tcc-bpmn

services:
  db:
    image: postgres:16
    container_name: tcc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bpmn}
      POSTGRES_USER: ${POSTGRES_USER:-bpmn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bpmn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bpmn} -d ${POSTGRES_DB:-bpmn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/backend.Dockerfile
    container_name: tcc-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-bpmn}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bpmn}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bpmn}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    container_name: tcc-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}/api/v1
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  db-data:
